apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bobo-bc/talos.git
    targetRevision: HEAD
    path: infrastructure
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec
        - /metadata
    - group: ""
      kind: PersistentVolume
      jsonPointers:
        - /spec
        - /metadata
  syncPolicy:
    automated:
      prune: false        # NEVER prune infrastructure
      selfHeal: true      # Fix drift but never delete
    syncOptions:
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s     # Longer backoff for infrastructure
        factor: 2
        maxDuration: 10m
