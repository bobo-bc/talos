apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketid
  namespace: pocketid
  labels:
    app: pocketid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pocketid
  strategy:
    type: Recreate           # Required with ReadWriteOnce PVC
  template:
    metadata:
      labels:
        app: pocketid
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pocketid
          image: ghcr.io/pocket-id/pocket-id:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 1411
              name: http
          env:
            - name: APP_URL
              value: "https://id.smeyer.ca"
            - name: TRUST_PROXY
              value: "true"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocketid-secrets
                  key: ENCRYPTION_KEY
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            # SQLite is default - no external database needed
            # Uncomment below to use PostgreSQL instead
            # - name: DB_PROVIDER
            #   value: "postgres"
            # - name: DB_CONNECTION_STRING
            #   valueFrom:
            #     secretKeyRef:
            #       name: pocketid-secrets
            #       key: DB_CONNECTION_STRING
          volumeMounts:
            - name: pocketid-data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 1411
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 1411
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 250m
      volumes:
        - name: pocketid-data
          persistentVolumeClaim:
            claimName: pocketid-data-pvc
