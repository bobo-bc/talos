apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission-vpn
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
  template:
    metadata:
      labels:
        app: transmission
    spec:
      containers:
      # --- CONTAINER 1: GLUETUN (The VPN) ---
      - name: vpn
        image: qmcgaw/gluetun:latest
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        env:
        - name: VPN_SERVICE_PROVIDER
          value: "nordvpn"
        - name: VPN_TYPE
          value: "openvpn"
        - name: OPENVPN_USER
          valueFrom:
            secretKeyRef:
              name: vpn-auth
              key: username
        - name: OPENVPN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vpn-auth
              key: password
        - name: SERVER_COUNTRIES
          value: "Canada"
        - name: FIREWALL_INBOUND_SUBNETS
          value: "10.0.0.0/8"
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: "10.0.0.0/8"
        - name: FIREWALL_INPUT_PORTS
          value: "9091"
        ports:
        - containerPort: 9091
          name: http-web
        - containerPort: 51413
          name: torrent-tcp
        - containerPort: 51413
          protocol: UDP
          name: torrent-udp
        volumeMounts:
        - name: tun
          mountPath: /dev/net/tun
      # --- CONTAINER 2: TRANSMISSION ---
      - name: transmission
        image: lscr.io/linuxserver/transmission:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Vancouver"
        - name: USER
          value: "admin"
        - name: PASS
          valueFrom:
            secretKeyRef:
              name: transmission-auth
              key: password
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /data
      # --- VOLUMES (must be at spec level, not inside a container) ---
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
      - name: config
        persistentVolumeClaim:
          claimName: transmission-config-pvc
      - name: downloads
        persistentVolumeClaim:
          claimName: nfs-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: transmission
  namespace: media
spec:
  ports:
  - port: 9091
    targetPort: 9091
  selector:
    app: transmission
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transmission
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: transmission.smeyer.ca
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: transmission
            port:
              number: 9091
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transmission-config-pvc
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
