---
# Internal service for Ghost CMS
apiVersion: v1
kind: Service
metadata:
  name: ghost
  namespace: ghost
  labels:
    app: ghost
spec:
  selector:
    app: ghost
  ports:
    - name: http
      protocol: TCP
      port: 2368
      targetPort: 2368

---
# Internal service for MySQL - named ghost-mysql to match config.production.json host
apiVersion: v1
kind: Service
metadata:
  name: ghost-mysql
  namespace: ghost
  labels:
    app: ghost-mysql
spec:
  selector:
    app: ghost-mysql
  ports:
    - name: mysql
      protocol: TCP
      port: 3306
      targetPort: 3306
