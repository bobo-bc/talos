---
# Ghost CMS Deployment using SREDevOps hardened distroless image
# Runs as non-root UID/GID 65532 (nonroot user in distroless)
# The SREDevOps image handles directory creation and theme copying internally
# No init container needed - removing it resolves PodSecurity restricted violations
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
  namespace: ghost
  labels:
    app: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost
  strategy:
    type: Recreate  # Required with ReadWriteOnce PVC - only one pod can mount at a time
  template:
    metadata:
      labels:
        app: ghost
    spec:
      # Allows Ghost to resolve its own public URL internally
      # without needing external DNS to loop back into the cluster
      hostAliases:
        - ip: "127.0.0.1"
          hostnames:
            - "ghost.smeyer.ca"
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ghost
          # SREDevOps hardened distroless Ghost image - check for latest tag at:
          # https://github.com/sredevopsorg/ghost-on-kubernetes/pkgs/container/ghost-on-kubernetes
          image: ghcr.io/sredevopsorg/ghost-on-kubernetes:main
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            readOnlyRootFilesystem: false
          env:
            - name: NODE_ENV
              value: production
          ports:
            - containerPort: 2368
              name: http
          volumeMounts:
            - name: ghost-content
              mountPath: /home/nonroot/app/ghost/content
            - name: ghost-config
              mountPath: /home/nonroot/app/ghost/config.production.json
              subPath: config.production.json
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 2368
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 2368
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: ghost-content
          persistentVolumeClaim:
            claimName: ghost-content-pvc
        - name: ghost-config
          secret:
            secretName: ghost-secrets
            items:
              - key: config.production.json
                path: config.production.json
