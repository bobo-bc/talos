---
# Ghost CMS Deployment using SREDevOps hardened distroless image
# Runs as non-root UID/GID 65532 (nonroot user in distroless)
# InitContainer sets up content directories and permissions before Ghost starts
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
  namespace: ghost
  labels:
    app: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghost
  strategy:
    type: Recreate  # Required with ReadWriteOnce PVC - only one pod can mount at a time
  template:
    metadata:
      labels:
        app: ghost
    spec:
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Creates required Ghost content subdirectories and sets correct ownership
        # Must run before the distroless main container since distroless has no shell
        - name: ghost-init
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          command:
            - sh
            - -c
            - |
              set -e
              GHOST_CONTENT=/var/lib/ghost/content
              for dir in apps data files images logs media public themes; do
                mkdir -pv $GHOST_CONTENT/$dir || echo "Error creating $GHOST_CONTENT/$dir"
                chown -Rfv 65532:65532 $GHOST_CONTENT/$dir && echo "chown ok on $dir" || echo "Error on $GHOST_CONTENT/$dir"
              done
              echo "Ghost init complete"
          volumeMounts:
            - name: ghost-content
              mountPath: /var/lib/ghost/content
      containers:
        - name: ghost
          # SREDevOps hardened distroless Ghost image - check for latest tag at:
          # https://github.com/sredevopsorg/ghost-on-kubernetes/pkgs/container/ghost-on-kubernetes
          image: ghcr.io/sredevopsorg/ghost-on-kubernetes:main
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: false
          env:
            - name: NODE_ENV
              value: production
          ports:
            - containerPort: 2368
              name: http
          volumeMounts:
            - name: ghost-content
              mountPath: /var/lib/ghost/content
            - name: ghost-config
              mountPath: /var/lib/ghost/config.production.json
              subPath: config.production.json
              readOnly: true
          livenessProbe:
            httpGet:
              path: /ghost/api/v4/admin/site/
              port: 2368
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ghost/api/v4/admin/site/
              port: 2368
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: ghost-content
          persistentVolumeClaim:
            claimName: ghost-content-pvc
        - name: ghost-config
          secret:
            secretName: ghost-config-secret
            items:
              - key: config.production.json
                path: config.production.json

            claimName: ghost
