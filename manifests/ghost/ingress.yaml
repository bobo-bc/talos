---
# Traefik IngressRoute for Ghost CMS
# Uses your existing Traefik setup and Let's Encrypt cert resolver
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ghost
  namespace: ghost
  labels:
    app: ghost
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ghost.smeyer.ca`)
      kind: Rule
      services:
        - name: ghost
          port: 2368
  tls:
    certResolver: letsencrypt

---
# Redirect HTTP to HTTPS
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ghost-http-redirect
  namespace: ghost
  labels:
    app: ghost
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`ghost.smeyer.ca`)
      kind: Rule
      middlewares:
        - name: ghost-https-redirect
      services:
        - name: ghost
          port: 2368

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ghost-https-redirect
  namespace: ghost
spec:
  redirectScheme:
    scheme: https
    permanent: true
