---
# ConfigMap with init SQL to create ghost user with wildcard host
# This runs automatically on first MySQL initialization
apiVersion: v1
kind: ConfigMap
metadata:
  name: ghost-mysql-initdb
  namespace: ghost
  labels:
    app: ghost-mysql
data:
  01-ghost-user.sql: |
    -- Ensure ghost user can connect from any pod IP (not just localhost)
    CREATE USER IF NOT EXISTS 'ghost'@'%' IDENTIFIED BY '${MYSQL_PASSWORD}';
    GRANT ALL PRIVILEGES ON ghost.* TO 'ghost'@'%';
    FLUSH PRIVILEGES;

---
# MySQL 8 StatefulSet
# Runs as MySQL's native UID 999 which is what the official image expects
# fsGroup: 999 ensures the Longhorn PVC is writable by the MySQL process
# No root init container needed - fsGroup handles volume permissions
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ghost-mysql
  namespace: ghost
  labels:
    app: ghost-mysql
spec:
  serviceName: ghost-mysql
  replicas: 1
  selector:
    matchLabels:
      app: ghost-mysql
  template:
    metadata:
      labels:
        app: ghost-mysql
    spec:
      securityContext:
        # MySQL official image uses UID/GID 999
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:9.6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: ghost-secrets
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ghost-secrets
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ghost-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ghost-secrets
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: ghost-mysql-data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          startupProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            # Allows up to 200s for MySQL to initialize on first boot
            failureThreshold: 18
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - 127.0.0.1
                - -P
                - "3306"
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: ghost-mysql-data
          persistentVolumeClaim:
            claimName: ghost-mysql-pvc
        - name: initdb
          configMap:
            name: ghost-mysql-initdb
