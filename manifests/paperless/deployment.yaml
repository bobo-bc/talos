---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
  namespace: paperless
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/part-of: paperless-ngx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
  strategy:
    type: Recreate  # Required — do not use RollingUpdate with shared NFS volumes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-ngx
    spec:
      securityContext:
        fsGroup: 1000  # Ensures NFS volume is writable by uid 1000
      initContainers:
        - name: wait-for-db
          image: postgres:18-alpine
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command:
            - sh
            - -c
            - |
              until pg_isready -h paperless-db -U paperless; do
                echo "Waiting for postgres..."; sleep 2;
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_DBPASS
      containers:
        - name: paperless-ngx
          image: ghcr.io/paperless-ngx/paperless-ngx:latest
          # s6-overlay requires root to set up /run then drops to uid 1000
          # via USERMAP_UID/GID — do not set runAsNonRoot or runAsUser here
          securityContext:
            allowPrivilegeEscalation: true
            runAsUser: 0
          ports:
            - containerPort: 8000
          env:
            # Database
            - name: PAPERLESS_DBENGINE
              value: postgresql
            - name: PAPERLESS_DBHOST
              value: paperless-db
            - name: PAPERLESS_DBPORT
              value: "5432"
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              value: paperless
            - name: PAPERLESS_DBPASS
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_DBPASS
            # Redis
            - name: PAPERLESS_REDIS
              value: redis://paperless-redis:6379
            # App secrets
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_SECRET_KEY
            - name: PAPERLESS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_ADMIN_USER
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_ADMIN_PASSWORD
            - name: PAPERLESS_ADMIN_MAIL
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_ADMIN_MAIL
            # Storage paths
            - name: PAPERLESS_CONSUMPTION_DIR
              value: /usr/src/paperless/consume
            - name: PAPERLESS_MEDIA_ROOT
              value: /usr/src/paperless/media
            - name: PAPERLESS_DATA_DIR
              value: /usr/src/paperless/data
            # URL
            - name: PAPERLESS_URL
              value: https://paperless.smeyer.ca
            # NFS — s6-overlay drops to this uid/gid after init
            - name: USERMAP_UID
              value: "1000"
            - name: USERMAP_GID
              value: "1000"
            # NFS doesn't support inotify so use polling
            - name: PAPERLESS_CONSUMER_POLLING
              value: "60"
            # OCR
            - name: PAPERLESS_OCR_LANGUAGE
              value: eng
            # Timezone
            - name: PAPERLESS_TIME_ZONE
              value: America/Vancouver
            # Workers
            - name: PAPERLESS_TASK_WORKERS
              value: "2"
            - name: PAPERLESS_THREADS_PER_WORKER
              value: "2"
          volumeMounts:
            - name: nfs-data
              mountPath: /usr/src/paperless/media
              subPath: paperless/media
            - name: nfs-data
              mountPath: /usr/src/paperless/consume
              subPath: paperless/consume
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: nfs-data
          persistentVolumeClaim:
            claimName: paperless-nfs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-ngx
  namespace: paperless
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/part-of: paperless-ngx
spec:
  selector:
    app.kubernetes.io/name: paperless-ngx
  ports:
    - port: 8000
      targetPort: 8000
