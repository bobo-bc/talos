---
# Secret for PostgreSQL credentials
# IMPORTANT: Replace values with strong passwords before applying
# Consider using Sealed Secrets or External Secrets Operator instead of
# committing plaintext secrets to git.
apiVersion: v1
kind: Secret
metadata:
  name: paperless-db-secret
  namespace: paperless
type: Opaque
stringData:
  POSTGRES_DB: paperless
  POSTGRES_USER: paperless
  POSTGRES_PASSWORD: CHANGE_ME_STRONG_PASSWORD   # <-- change this
---
# Secret for Paperless-ngx app credentials
apiVersion: v1
kind: Secret
metadata:
  name: paperless-secret
  namespace: paperless
type: Opaque
stringData:
  PAPERLESS_SECRET_KEY: CHANGE_ME_LONG_RANDOM_STRING_64CHARS  # <-- change this
  PAPERLESS_DBPASS: CHANGE_ME_STRONG_PASSWORD                 # <-- must match POSTGRES_PASSWORD above
  PAPERLESS_ADMIN_USER: admin
  PAPERLESS_ADMIN_PASSWORD: CHANGE_ME_ADMIN_PASSWORD          # <-- change this
  PAPERLESS_ADMIN_MAIL: admin@example.com                     # <-- change this
