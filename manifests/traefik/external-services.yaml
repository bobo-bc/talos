http:
  routers:
    # --- Redirect HTTP to HTTPS ---
    http-catchall:
      rule: "HostRegexp(`{host:.+}`)"
      entryPoints: ["web"]
      middlewares: ["redirect-to-https"]
      service: "noop"

    # --- Your Services ---
    plex-router:
      rule: "Host(`plex.smeyer.ca`)"
      entryPoints: ["websecure"]
      service: plex-external
      tls: {}

    unifi-router:
      rule: "Host(`unifi.smeyer.ca`)"
      entryPoints: ["websecure"]
      service: unifi-external
      tls: {}

    pve-router:
      rule: "Host(`pve.smeyer.ca`)"
      entryPoints: ["websecure"]
      service: pve-external
      tls: {}

    pbs-router:
      rule: "Host(`pbs.smeyer.ca`)"
      entryPoints: ["websecure"]
      service: pbs-external
      tls: {}
    repo-router:
      rule: "Host(`repo.smeyer.ca`)"
      entryPoints: ["websecure"]
      service: pbs-external
      tls: {}

    homeassist-router:
      rule: "Host(`homeassist.smeyer.ca`)"
      entryPoints: ["websecure"]
  #    middlewares: ["pocketid-auth@file"]   # Protected by PocketID
      service: homeassist-external
      tls: {}

  # --- Middleware Definitions ---
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

    # PocketID OIDC Auth Middleware
    pocketid-auth:
      plugin:
        traefik-oidc-auth:
          # Generate with: openssl rand -base64 32
          Secret: "199cf9d2cebff4feb8d3a304c7757622bc581eef1fe536e10efabb45d53b4a64"
          Provider:
            Url: "https://id.smeyer.ca"
            ClientId: "040abdf0-d08f-496e-8fc6-a4913eef4187"
            ClientSecret: "QgiK4HRXTet7KebmZODooRc99VqZTxQg"
          Scopes: ["openid", "profile", "email"]
          UsePkce: true
          TokenValidation: "IdToken"
          # After login, redirect back to original URL
          PostLoginRedirectUri: ""

  # --- Service Definitions ---
  services:
    noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1"

    plex-external:
      loadBalancer:
        servers:
          - url: "http://10.0.2.10:32400"

    unifi-external:
      loadBalancer:
        servers:
          - url: "https://10.0.0.1:443"
        serversTransport: insecureTransport

    pve-external:
      loadBalancer:
        servers:
          - url: "https://10.0.0.5:8006"
        serversTransport: insecureTransport

    pbs-external:
      loadBalancer:
        servers:
          - url: "https://10.0.0.10:8007"
        serversTransport: insecureTransport

    repo-external:
      loadBalancer:
        servers:
          - url: "https://10.0.0.8:3000"
        serversTransport: insecureTransport
        
    homeassist-external:
      loadBalancer:
        servers:
          - url: "http://10.0.2.4:8123"

  # --- Global Transport Settings ---
  serversTransports:
    insecureTransport:
      insecureSkipVerify: true
