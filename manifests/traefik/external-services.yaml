http:
  routers:
    # --- Redirect HTTP to HTTPS ---
    http-catchall:
      rule: "HostRegexp(`{host:.+}`)"
      entryPoints: ["web"]
      middlewares: ["redirect-to-https"]
      service: "noop" # Necessary but never reached

    # --- Your Services ---
    plex-router:
      rule: "Host(`plex.smeyer.ca`)"
      entryPoints: ["websecure"]
      service: plex-external
      tls: {}

    unifi-router:
      rule: "Host(`unifi.smeyer.ca`)"
      entryPoints: ["websecure"]
      service: unifi-external
      tls: {}

    pve-router:
      rule: "Host(`pve.smeyer.ca`)"
      entryPoints: ["websecure"]
      service: pve-external
      tls: {}
    pbs-router:
      rule: "Host(`pbs.smeyer.ca`)"
      entryPoints: ["websecure"]
      service: pbs-external
      tls: {}


    homeassist-router:
      rule: "Host(`homeassist.smeyer.ca`)"
      entryPoints: ["web"]
      service: homeassist-external
      tls: {}
  
  # --- Middleware Definitions ---
  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

  # --- Service Definitions ---
  services:
    # A dummy service for the redirector
    noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1"

    plex-external:
      loadBalancer:
        servers:
          - url: "http://10.0.2.10:32400"

    unifi-external:
      loadBalancer:
        servers:
          - url: "https://10.0.0.1:443"
        serversTransport: insecureTransport

    pve-external:
      loadBalancer:
        servers:
          - url: "https://10.0.0.5:8006"
        serversTransport: insecureTransport
        
    pbs-external:
      loadBalancer:
        servers:
          - url: "https://10.0.0.10:8007"
        serversTransport: insecureTransport


    homeassist-external:
      loadBalancer:
        servers:
          - url: "http://10.0.2.4:8123"

  # --- Global Transport Settings ---
  serversTransports:
    insecureTransport:
      insecureSkipVerify: true
