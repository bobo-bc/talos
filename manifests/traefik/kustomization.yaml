apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - dashboard-ingress.yaml
  - tls-store.yaml
  - wildcard-cert.yaml

# Clean and simple: No more line 14 mapping errors!
configMapGenerator:
  - name: traefik-external-config
    namespace: traefik
    files:
      - external-services.yaml

helmCharts:
  - name: traefik
    releaseName: traefik
    namespace: traefik
    repo: https://traefik.github.io/charts
    version: 34.0.0 
    valuesInline:
      deployment:
        kind: Deployment
        additionalVolumes:
          - name: external-config
            configMap:
              name: traefik-external-config
        additionalVolumeMounts:
          - name: external-config
            mountPath: /config
            readOnly: true
      
      additionalArguments:
        - "--providers.file.directory=/config"
        - "--providers.file.watch=true"

      installCRDs: true
      ingressClass:
        enabled: true
        isDefaultClass: true
      metrics:
        prometheus:
          entryPoint: metrics
      service:
        metrics:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "8082"
      ports:
        web:
          exposedPort: 80
        websecure:
          exposedPort: 443
        metrics:
          port: 8082
          exposedPort: 8082
