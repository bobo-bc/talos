apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - dashboard-ingress.yaml
  - tls-store.yaml
  - wildcard-cert.yaml

# This creates the "external-services.yaml" file inside a ConfigMap
configMapGenerator:
  - name: traefik-external-config
    namespace: traefik
    literals:
      - external-services.yaml=|
        http:
          routers:
            plex-router:
              rule: "Host(`plex.smeyer.ca`)"
              entryPoints:
                - web
                - websecure
              service: plex-external
              tls: {} # Uses your wildcard cert automatically
          services:
            plex-external:
              loadBalancer:
                servers:
                  - url: "http://10.0.2.10:32400"

helmCharts:
  - name: traefik
    releaseName: traefik
    namespace: traefik
    repo: https://traefik.github.io/charts
    version: 34.0.0 
    valuesInline:
      deployment:
        kind: Deployment
        # --- ADDED: Volume Mounts ---
        additionalVolumes:
          - name: external-config
            configMap:
              name: traefik-external-config
        additionalVolumeMounts:
          - name: external-config
            mountPath: /config
            readOnly: true
      
      # --- ADDED: Static Config Arguments ---
      additionalArguments:
        - "--providers.file.directory=/config"
        - "--providers.file.watch=true"

      installCRDs: true
      ingressClass:
        enabled: true
        isDefaultClass: true
      metrics:
        prometheus:
          entryPoint: metrics
      service:
        metrics:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "8082"
      ports:
        web:
          exposedPort: 80
        websecure:
          exposedPort: 443
        metrics:
          port: 8082
          exposedPort: 8082
