apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dashboard-ingress.yaml
  - tls-store.yaml
  - wildcard-cert.yaml
configMapGenerator:
  - name: traefik-external-config
    namespace: traefik
    files:
      - external-services.yaml
helmCharts:
  - name: traefik
    releaseName: traefik
    namespace: traefik
    repo: https://traefik.github.io/charts
    version: 39.0.6
    valuesInline:
      # This is the "Static Config" argument for the File Provider
      additionalArguments:
        - "--providers.file.directory=/config"
        - "--providers.file.watch=true"
        # Enable experimental plugins
        - "--experimental.plugins.traefik-oidc-auth.moduleName=github.com/sevensolutions/traefik-oidc-auth"
        - "--experimental.plugins.traefik-oidc-auth.version=v0.8.0"

      # Enable experimental features for plugins
      experimental:
        plugins:
          traefik-oidc-auth:
            moduleName: "github.com/sevensolutions/traefik-oidc-auth"
            version: "v0.8.0"

      ingressClass:
        enabled: true
        isDefaultClass: true
      metrics:
        prometheus:
          entryPoint: metrics
      service:
        metrics:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "8082"
      ports:
        web:
          exposedPort: 80
        websecure:
          exposedPort: 443
        metrics:
          port: 8082
          exposedPort: 8082
        smtp:
          port: 25
          exposedPort: 25
          protocol: TCP
        submission:
          port: 587
          exposedPort: 587
          protocol: TCP
        smtps:
          port: 465
          exposedPort: 465
          protocol: TCP
        imaps:
          port: 993
          exposedPort: 993
          protocol: TCP

# --- THE PATCH ---
patches:
  - target:
      kind: Deployment
      name: traefik
      namespace: traefik
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: traefik
      spec:
        template:
          spec:
            containers:
              - name: traefik
                volumeMounts:
                  - name: external-config
                    mountPath: /config
                    readOnly: true
            volumes:
              - name: external-config
                configMap:
                  name: traefik-external-config
