apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - dashboard-ingress.yaml
  - tls-store.yaml
  - wildcard-cert.yaml

configMapGenerator:
  - name: traefik-external-config
    namespace: traefik
    files:
      - external-services.yaml

helmCharts:
  - name: traefik
    releaseName: traefik
    namespace: traefik
    repo: https://traefik.github.io/charts
    version: 34.0.0 
    valuesInline:
      # Keep your existing metrics/ports here, but we'll 
      # handle the volumes via the patch below for reliability.
      installCRDs: true
      ingressClass:
        enabled: true
        isDefaultClass: true
      additionalArguments:
        - "--providers.file.directory=/config"
        - "--providers.file.watch=true"

# --- THE FIX: MANUAL INJECTION ---
patches:
  - target:
      kind: Deployment
      name: traefik
      namespace: traefik
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: traefik
      spec:
        template:
          spec:
            containers:
              - name: traefik
                volumeMounts:
                  - name: external-config
                    mountPath: /config
                    readOnly: true
            volumes:
              - name: external-config
                configMap:
                  name: traefik-external-config
      ingressClass:
        enabled: true
        isDefaultClass: true
      # ... rest of your config
      metrics:
        prometheus:
          entryPoint: metrics
      service:
        metrics:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "8082"
      ports:
        web:
          exposedPort: 80
        websecure:
          exposedPort: 443
        metrics:
          port: 8082
          exposedPort: 8082
