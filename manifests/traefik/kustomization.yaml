apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - dashboard-ingress.yaml
  - tls-store.yaml
  - wildcard-cert.yaml

configMapGenerator:
  - name: traefik-external-config
    namespace: traefik
    literals:
      - external-services.yaml=|
          http:
            routers:
              plex-router:
                rule: "Host(`plex.smeyer.ca`)"
                entryPoints:
                  - web
                  - websecure
                service: plex-external
                tls: {}
            services:
              plex-external:
                loadBalancer:
                  servers:
                    - url: "http://10.0.2.10:32400"

helmCharts:
  - name: traefik
    releaseName: traefik
    namespace: traefik
    repo: https://traefik.github.io/charts
    version: 34.0.0 
    valuesInline:
      deployment:
        kind: Deployment
        additionalVolumes:
          - name: external-config
            configMap:
              name: traefik-external-config
        additionalVolumeMounts:
          - name: external-config
            mountPath: /config
            readOnly: true
      
      additionalArguments:
        - "--providers.file.directory=/config"
        - "--providers.file.watch=true"

      installCRDs: true
      # ... (keep the rest of your metrics and ports as they were)
