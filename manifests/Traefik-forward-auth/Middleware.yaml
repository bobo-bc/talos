# ==========================================================================
# Traefik Middleware - PocketID Forward Auth
# Apply this middleware to any IngressRoute you want to protect
#
# Usage - add to any IngressRoute:
#   middlewares:
#     - name: pocketid-auth
#       namespace: traefik-forward-auth
# ==========================================================================
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pocketid-auth
  namespace: traefik-forward-auth
spec:
  forwardAuth:
    address: http://traefik-forward-auth.traefik-forward-auth.svc.cluster.local:4181
    trustForwardHeader: true
    authResponseHeaders:
      - X-Forwarded-User
      - X-Forwarded-Email
      - X-Forwarded-Groups
