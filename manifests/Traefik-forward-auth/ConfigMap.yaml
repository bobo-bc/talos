apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-forward-auth-config
  namespace: traefik-forward-auth
data:
  config.yaml: |
    # ==========================================================================
    # Traefik Forward Auth v4.8 - PocketID Configuration
    # ==========================================================================

    # Hostname that this service is reachable at (for OAuth2 callbacks)
    hostname: "tfa.smeyer.ca"

    # Cookie settings
    cookie:
      # Single cookie covers all subdomains
      domain: "smeyer.ca"

    # Session lifetime
    session:
      lifetime: "24h"

    # Portal configuration
    portals:
      - name: "default"
        providers:
          - openIDConnect:
              name: "pocketid"
              displayName: "PocketID"
              # PocketID OIDC discovery endpoint
              tokenIssuer: "https://id.smeyer.ca"
              clientID: "${POCKETID_CLIENT_ID}"
              clientSecretFile: "/secrets/client-secret"
              scopes: "openid profile email"
              # Enable PKCE
              usePKCE: true
