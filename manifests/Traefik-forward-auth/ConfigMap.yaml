apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-forward-auth-config
  namespace: traefik-forward-auth
data:
  config.yaml: |
    # ==========================================================================
    # Traefik Forward Auth v4.8 - PocketID Configuration
    # Using native PocketID provider (not generic OIDC)
    # ==========================================================================

    server:
      # Hostname this service is reachable at - used for OAuth2 callbacks
      hostname: "tfa.smeyer.ca"

    cookies:
      # Single cookie covers all *.smeyer.ca subdomains
      domain: "smeyer.ca"

    tokens:
      # Session lifetime - randomly generated signing key on startup (recommended)
      sessionLifetime: "24h"

    # Make default portal available at root without /portals/default/ prefix
    defaultPortal: "default"

    portals:
      - name: "default"
        displayName: "Homelab"
        providers:
          - pocketID:
              name: "pocketid"
              displayName: "PocketID"
              # PocketID server endpoint
              endpoint: "https://id.smeyer.ca"
              # Client ID from PocketID OIDC client
              clientID: "040abdf0-d08f-496e-8fc6-a4913eef4187"
              # Client secret mounted as file (more secure)
              clientSecretFile: "/secrets/client-secret"
              scopes: "openid profile email groups"
              enablePKCE: true
