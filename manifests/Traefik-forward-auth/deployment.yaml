apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-forward-auth
  namespace: traefik-forward-auth
  labels:
    app: traefik-forward-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik-forward-auth
  template:
    metadata:
      labels:
        app: traefik-forward-auth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik-forward-auth
          image: ghcr.io/italypaleale/traefik-forward-auth:4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65532
          ports:
            - containerPort: 4181
              name: http
          env:
            # Client ID from secret
            - name: POCKETID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: traefik-forward-auth-secret
                  key: POCKETID_CLIENT_ID
          volumeMounts:
            # Mount config.yaml
            - name: config
              mountPath: /etc/traefik-forward-auth
              readOnly: true
            # Mount client secret as file (more secure than env var)
            - name: secrets
              mountPath: /secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4181
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4181
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 100m
      volumes:
        - name: config
          configMap:
            name: traefik-forward-auth-config
        - name: secrets
          secret:
            secretName: traefik-forward-auth-secret
            items:
              - key: client-secret
                path: client-secret
