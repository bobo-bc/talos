# Middleware: redirect HTTP -> HTTPS
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lidarr-redirect-https
  namespace: media
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# IngressRoute for HTTP (redirect only)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lidarr-http
  namespace: media
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`music.smeyer.ca`)
      kind: Rule
      middlewares:
        - name: lidarr-redirect-https
      services:
        - name: lidarr
          port: 8686
---
# IngressRoute for HTTPS with PocketID auth
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lidarr
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`music.smeyer.ca`)
      kind: Rule
      middlewares:
        - name: pocketid-auth
          namespace: traefik-forward-auth
      services:
        - name: lidarr
          port: 8686
  tls:
    secretName: wildcard-smeyer-ca-tls
