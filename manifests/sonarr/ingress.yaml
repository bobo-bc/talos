# Middleware: redirect HTTP -> HTTPS
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sonarr-redirect-https
  namespace: media
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# IngressRoute for HTTP (redirect only)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr-http
  namespace: media
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`tv.smeyer.ca`)
      kind: Rule
      middlewares:
        - name: sonarr-redirect-https
      services:
        - name: sonarr
          port: 8989
---
# IngressRoute for HTTPS with PocketID auth
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sonarr
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tv.smeyer.ca`)
      kind: Rule
  #    middlewares:
  #      - name: pocketid-auth
  #        namespace: traefik-forward-auth
      services:
        - name: sonarr
          port: 8989
  tls:
    secretName: wildcard-smeyer-ca-tls
