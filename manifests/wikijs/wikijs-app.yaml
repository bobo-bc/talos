apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wikijs
  namespace: argocd
spec:
  project: default
  source:
    chart: wiki
    repoURL: https://charts.js.wiki
    targetRevision: 3.0.0
    helm:
      values: |
        image:
          tag: 2.5.312 

        # 1. Wiki.js Native Database Connection
        postgresql:
          enabled: true
          # Connection info for the App
          existingSecret: "wikijs-db-pass"
          existingSecretKey: "password"
          
          # 2. PostgreSQL Sub-Chart Configuration
          auth:
            database: wikijs
            username: wikijs
            existingSecret: "wikijs-db-pass"
            secretKeys:
              adminPasswordKey: "postgres-password"
              userPasswordKey: "password"
          persistence:
            enabled: true
            storageClass: "longhorn" 
            size: 8Gi

        # 3. Ingress & TLS (Updated for Traefik)
        ingress:
          enabled: true
          className: traefik  # Changed from nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            kubernetes.io/tls-acme: "true"
            # Traefik often prefers this for SSL redirection if you have it set up
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
          hosts:
            - host: wiki.smeyer.ca
              paths:
                - path: /
                  pathType: Prefix # Vital for Traefik to route correctly
          tls:
            - secretName: wiki-smeyer-ca-tls
              hosts:
                - wiki.smeyer.ca

        # 4. Wiki.js Asset Persistence
        persistence:
          enabled: true
          storageClass: "longhorn"
          size: 5Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: wikijs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    createNamespace: true
