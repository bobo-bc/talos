apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wikijs
  namespace: argocd
spec:
  project: default
  source:
    chart: wiki
    repoURL: https://charts.js.wiki
    targetRevision: 6.x.x
    helm:
      values: |
        image:
          tag: 2.5 

        # Corrected: extraEnv must be at the same level as 'image'
        extraEnv:
          - name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: wikijs-db-pass
                key: password

        ingress:
          enabled: true
          className: nginx 
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            kubernetes.io/tls-acme: "true"
          hosts:
            - host: wiki.smeyer.ca
              paths:
                - path: /
          tls:
            - secretName: wiki-smeyer-ca-tls
              hosts:
                - wiki.smeyer.ca

        postgresql:
          enabled: true
          persistence:
            enabled: true
            storageClass: "longhorn" 
            size: 8Gi
          auth:
            database: wikijs
            username: wikijs
            existingSecret: "wikijs-db-pass"
            secretKeys:
              adminPasswordKey: "postgres-password"
              userPasswordKey: "password"

        persistence:
          enabled: true
          storageClass: "longhorn"
          size: 5Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: wikijs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    createNamespace: true
