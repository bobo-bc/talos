apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stalwart
  namespace: stalwart
  labels:
    app.kubernetes.io/name: stalwart
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod  # adjust to your ClusterIssuer name
spec:
  ingressClassName: traefik
  tls:
    - secretName: wildcard-smeyer-ca-tls 
      hosts:
        - postmaster.mg.smeyer.ca  # adjust to your mail domain
  rules:
    - host: mg.smeyer.ca  # adjust to your mail domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stalwart
                port:
                  name: http
