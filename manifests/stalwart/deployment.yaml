apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart
  namespace: stalwart
  labels:
    app.kubernetes.io/name: stalwart
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  strategy:
    type: Recreate  # Required — only one pod can own the Longhorn RWO volume at a time
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: stalwart
          image: stalwartlabs/server:v0.15.5
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0  # Stalwart needs root to bind low ports
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: smtp
              containerPort: 25
              protocol: TCP
            - name: submission
              containerPort: 587
              protocol: TCP
            - name: smtps
              containerPort: 465
              protocol: TCP
            - name: imap
              containerPort: 143
              protocol: TCP
            - name: imaps
              containerPort: 993
              protocol: TCP
            - name: sieve
              containerPort: 4190
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: stalwart-data
              mountPath: /opt/stalwart
      volumes:
        - name: stalwart-data
          persistentVolumeClaim:
            claimName: stalwart
