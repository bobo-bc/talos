apiVersion: apps/v1
kind: Deployment
metadata:
  name: drawio
  namespace: drawio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drawio
  template:
    metadata:
      labels:
        app: drawio
    spec:
      containers:
        - name: drawio
          image: jgraph/drawio:24.4.8 # Use a specific version for stability
          ports:
            - containerPort: 8080
          env:
            # This helps Traefik know how to build URLs inside the app
            - name: DRAWIO_SERVER_URL
              value: "https://drawio.smeyer.ca"
---
apiVersion: v1
kind: Service
metadata:
  name: drawio
  namespace: drawio
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: drawio
