apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-external-config
  namespace: traefik # Ensure this is the same namespace where Traefik is installed
data:
  external-services.yaml: |
    http:
      routers:
        plex-router:
          rule: "Host(`plex.smeyer.ca`)"
          entryPoints:
            - web
            - websecure
          service: plex-external
          tls: {} # Enables SSL if you have a default cert/cert-manager
      
      services:
        plex-external:
          loadBalancer:
            servers:
              - url: "http://10.0.2.10:32400"
