---
apiVersion: v1
kind: Service
metadata:
  name: external-plex
  namespace: media
spec:
  type: ExternalName
  externalName: 10.0.2.10 # <--- Your Plex IP here
  ports:
    - name: web
      port: 32400
      protocol: TCP
      targetPort: 32400
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plex-ingress
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik
    # This tells Traefik to allow routing to an ExternalName service
    traefik.ingress.kubernetes.io/service.passhostheader: "true"
spec:
  rules:
  - host: plex.smeyer.ca
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: external-plex
            port:
              number: 32400
