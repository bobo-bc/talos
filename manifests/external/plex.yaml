---
apiVersion: v1
kind: Service
metadata:
  name: external-plex
  namespace: media
spec:
  ports:
    - name: web
      protocol: TCP
      port: 32400
      targetPort: 32400
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-plex
  namespace: media
subsets:
  - addresses:
      - ip: 10.0.2.10 # <--- REPLACE with your Plex LXC/VM IP
    ports:
      - name: web
        port: 32400
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plex-ingress
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik
    # Optional: If you want to force HTTPS redirection
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
  - host: plex.smeyer.ca
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: external-plex
            port:
              number: 32400
