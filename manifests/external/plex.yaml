apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: plex-external-service
  namespace: media
spec:
  externalName: 10.0.2.10 # Your Plex IP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: plex-ingress
  namespace: media
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`plex.smeyer.ca`)
    kind: Rule
    services:
    - name: plex-external-service
      port: 32400
