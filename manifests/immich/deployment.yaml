apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v1.106.1 # Using a stable tag
          ports:
            - containerPort: 3001
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: immich-db-secret
                  key: DB_URL
            - name: REDIS_HOSTNAME
              value: immich-redis
            - name: REDIS_PORT
              value: "6379"
            - name: IMMICH_PORT
              value: "3001"
            - name: NODE_ENV
              value: production
            - name: TZ
              value: America/Vancouver
          # Corrected Startup Probe to match your containerPort
          startupProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            failureThreshold: 30
            periodSeconds: 10
          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library-pvc # Updated to your existing PVC
