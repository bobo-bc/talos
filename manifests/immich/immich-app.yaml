apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: immich
  source:
    repoURL: 'https://immich-app.github.io/immich-charts'
    chart: immich
    targetRevision: 0.10.3
    helm:
      values: |
        # --- DO NOT ADD 'postgresql' or 'redis' KEYS HERE ---

        immich:
          configuration:
            database:
              host: "immich-postgresql"
              port: 5432
              user: "postgres"
              database: "immich"
            redis:
              host: "redis" # Matches your manual service name
          
          extraEnvVars:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-secret
                  key: DB_PASSWORD

          persistence:
            library:
              existingClaim: "immich-library-pvc"

          server:
            startupProbe:
              initialDelaySeconds: 60
              periodSeconds: 10
              failureThreshold: 60
          
          microservices:
            startupProbe:
              initialDelaySeconds: 60
              periodSeconds: 10
              failureThreshold: 60

          machine-learning:
            enabled: true
            persistence:
              cache:
                enabled: true
                type: emptyDir

          ingress:
            main:
              enabled: true
              annotations:
                kubernetes.io/ingress.class: traefik
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
              hosts:
                - host: immich.smeyer.ca
                  paths:
                    - path: /
              tls:
                - secretName: wildcard-smeyer-ca-tls

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/startupProbe/successThreshold
        - /spec/template/spec/containers/0/livenessProbe/successThreshold
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /status/loadBalancer

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
