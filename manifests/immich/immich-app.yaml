apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://immich-app.github.io/immich-charts'
    chart: immich
    targetRevision: 0.8.1
    helm:
      values: |
        # 1. DISABLE ALL INTERNAL DEPENDENCIES
        # We handle these manually for Talos stability
        postgresql:
          enabled: false
        redis:
          enabled: false
        valkey:
          enabled: false

        # 2. MAIN IMMICH CONFIGURATION
        immich:
          persistence:
            library:
              existingClaim: "immich-library-pvc"
          
          # Networking: Point to your manual services
          configuration:
            database:
              host: "immich-postgresql" # Your manual service name
              port: 5432
              user: "postgres"
              database: "immich"
            redis:
              host: "redis" # Your manual service name
          
          # Database Authentication: Injects password into all Immich pods
          extraEnvVars:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-secret
                  key: DB_PASSWORD

          # Component Specifics
          server:
            startupProbe:
              initialDelaySeconds: 60
              periodSeconds: 10
              failureThreshold: 30
          
          microservices:
            startupProbe:
              initialDelaySeconds: 60
              periodSeconds: 10
              failureThreshold: 30

          machine-learning:
            enabled: true
            persistence:
              cache:
                enabled: true
                type: emptyDir
            resources:
              limits:
                memory: 2048Mi
              requests:
                memory: 1024Mi

          ingress:
            main:
              enabled: true
              annotations:
                kubernetes.io/ingress.class: traefik
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
                traefik.ingress.kubernetes.io/router.tls: "true"
              hosts:
                - host: immich.smeyer.ca
                  paths:
                    - path: /
              tls:
                - secretName: wildcard-smeyer-ca-tls

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
