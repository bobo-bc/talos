apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: immich
  source:
    repoURL: 'https://immich-app.github.io/immich-charts'
    chart: immich
    targetRevision: 0.10.3
    helm:
      values: |
        # IMPORTANT: The 'postgresql' and 'redis' top-level keys 
        # MUST BE REMOVED to pass the chart's internal checks.

        immich:
          # This is where 0.10.x looks for connection details
          configuration:
            database:
              host: "immich-postgresql"
              port: 5432
              user: "postgres"
              database: "immich"
            redis:
              host: "redis"
          
          extraEnvVars:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-secret
                  key: DB_PASSWORD

          persistence:
            library:
              existingClaim: "immich-library-pvc"

          server:
            startupProbe:
              initialDelaySeconds: 60
              periodSeconds: 10
              failureThreshold: 60
          
          microservices:
            startupProbe:
              initialDelaySeconds: 60
              periodSeconds: 10
              failureThreshold: 60

          machine-learning:
            enabled: true
            persistence:
              cache:
                enabled: true
                type: emptyDir

          ingress:
            main:
              enabled: true
              annotations:
                kubernetes.io/ingress.class: traefik
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
              hosts:
                - host: immich.smeyer.ca
                  paths:
                    - path: /
              tls:
                - secretName: wildcard-smeyer-ca-tls
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
