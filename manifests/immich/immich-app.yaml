apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: immich
  source:
    repoURL: 'https://immich-app.github.io/immich-charts'
    chart: immich
    targetRevision: 0.10.0
    helm:
      values: |
        # Disable internal sub-charts
        postgresql: { enabled: false }
        redis: { enabled: false }
        valkey: { enabled: false }

        # This section is the "Engine Room" from your k3s config
        env:
          REDIS_HOSTNAME: "immich-redis"
          DB_HOSTNAME: "immich-postgresql"
          DB_USERNAME: "postgres"
          DB_DATABASE_NAME: "immich"

        immich:
          # Injects the password from your prerequisite secret
          extraEnvVars:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-secret
                  key: DB_PASSWORD

          persistence:
            library:
              existingClaim: "immich-library-pvc"
          
          # Relaxing probes to stop the "Disappearing Pod" act
          server:
            startupProbe:
              initialDelaySeconds: 60
              periodSeconds: 10
              failureThreshold: 60 # 10 mins total
          
          microservices:
            startupProbe:
              initialDelaySeconds: 60
              periodSeconds: 10
              failureThreshold: 60

          machine-learning:
            enabled: true
            persistence:
              cache:
                enabled: true
                type: emptyDir

          ingress:
            main:
              enabled: true
              annotations:
                kubernetes.io/ingress.class: traefik
                traefik.ingress.kubernetes.io/router.entrypoints: websecure
              hosts:
                - host: immich.smeyer.ca
                  paths:
                    - path: /
              tls:
                - secretName: wildcard-smeyer-ca-tls
