apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: immich
  source:
    repoURL: 'https://immich-app.github.io/immich-charts'
    chart: immich
    targetRevision: 0.10.3
    helm:
      values: |
        # ... (your immich configuration values)

  # --- THIS IS THE NEW BLOCK ---
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/startupProbe/successThreshold
        - /spec/template/spec/containers/0/livenessProbe/successThreshold
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /status/loadBalancer

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true # <--- CRITICAL: Tells Argo to respect the ignore block during Sync
