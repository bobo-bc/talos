apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://immich-app.github.io/immich-charts'
    chart: immich
    targetRevision: 0.8.1
    helm:
      values: |
        # Bundled Postgres with AI extension
        postgresql:
          enabled: true
          image:
            repository: tensorchord/pgvecto-rs
            tag: pg14-v0.2.0
          persistence:
            enabled: true
            storageClass: "longhorn"
            size: 10Gi
        
        redis:
          enabled: true

        # Main Photo Library
        persistence:
          library:
            enabled: true
            size: 100Gi
            storageClass: "longhorn"
            accessMode: ReadWriteOnce

        # THE FIX: Explicitly handle Machine Learning persistence
        machine-learning:
          enabled: true
          persistence:
            cache:
              enabled: true
              type: emptyDir  # Uses node RAM/disk temporarily for AI models
          resources:
            limits:
              memory: 2048Mi
            requests:
              memory: 1024Mi

        ingress:
          main:
            enabled: true
            annotations:
              kubernetes.io/ingress.class: traefik
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
            hosts:
              - host: immich.smeyer.ca
                paths:
                  - path: /
            tls:
              - secretName: wildcard-smeyer-ca-tls
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
