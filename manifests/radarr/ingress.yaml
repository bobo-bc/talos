# Middleware: redirect HTTP -> HTTPS
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: radarr-redirect-https
  namespace: media
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# IngressRoute for HTTP (redirect only)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr-http
  namespace: media
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`movies.smeyer.ca`)
      kind: Rule
      middlewares:
        - name: radarr-redirect-https
      services:
        - name: radarr
          port: 7878
---
# IngressRoute for HTTPS with PocketID auth
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`movies.smeyer.ca`)
      kind: Rule
      middlewares:
        - name: pocketid-auth
          namespace: traefik-forward-auth
      services:
        - name: radarr
          port: 7878
  tls:
    secretName: wildcard-smeyer-ca-tls
