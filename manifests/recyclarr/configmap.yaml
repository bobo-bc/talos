# configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: recyclarr
data:
  recyclarr.yml: |
    sonarr:
      main:
        base_url: http://sonarr.media.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY
        quality_definition:
          type: series
        quality_profiles:
          - name: WEB-1080p
            reset_unmatched_scores:
              enabled: true
            upgrade:
              allowed: true
              until_quality: WEB 1080p
              until_score: 10000
            min_format_score: 0
            quality_sort: top
            qualities:
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
        custom_formats:
          - trash_ids:
              - 418f50b10f1907201b6cfdf881f467b7 # Repack/Proper
              - e7718d7a3ce595f289bfee26adc178f5 # Repack v2
              - ae43b294509409a6a13919dedd4764c4 # Repack v3
              - 1b3994c551cbb92a2c781af061f4ab44 # Season Pack
            quality_profiles:
              - name: WEB-1080p

    radarr:
      main:
        base_url: http://radarr.media.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY
        quality_definition:
          type: movie
        quality_profiles:
          - name: HD-1080p
            reset_unmatched_scores:
              enabled: true
            upgrade:
              allowed: true
              until_quality: Bluray-1080p
              until_score: 10000
            min_format_score: 0
            quality_sort: top
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
        custom_formats:
          - trash_ids:
              - e71939fae578037e7aed3ee219bbe7c1 # Repack/Proper
              - ae43b294509409a6a13919dedd4764c4 # Repack v2
              - 280b56fe7bc7462b5c76e680b9b2a959 # Repack v3
            quality_profiles:
              - name: HD-1080p
