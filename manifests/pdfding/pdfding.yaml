apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdfding
  namespace: pdfding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdfding
  template:
    metadata:
      labels:
        app: pdfding
    spec:
      # This fixes the Longhorn permission issues
   #   initContainers:
   #     - name: init-pvc
   #       image: busybox
   #       command: ["sh", "-c", "mkdir -p /home/nonroot/pdfding/db /home/nonroot/pdfding/media && chown -R 1000:1000 /home/nonroot/pdfding/db /home/nonroot/pdfding/media"]
   #       volumeMounts:
   #         - name: pdfding-db
   #           mountPath: /home/nonroot/pdfding/db
   #         - name: pdfding-media
   #           mountPath: /home/nonroot/pdfding/media
      containers:
        - name: pdfding
          image: mrmn/pdfding:v1.7.0
          ports:
            - containerPort: 8000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pdfding-secrets
                  key: SECRET_KEY
      # --- ADD THESE FOR POCKETID OIDC ---
            - name: OIDC_ENABLE
              value: "TRUE"
            - name: OIDC_PROVIDER_NAME
              value: "pocketid"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pdfding-secrets
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pdfding-secrets
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_AUTH_URL
              value: "https://id.smeyer.ca/authorize"
            - name: OIDC_AUTHORIZATION_ENDPOINT
              value: "https://id.smeyer.ca/authorize"
            - name: OIDC_TOKEN_ENDPOINT
              value: "https://id.smeyer.ca/api/oidc/token"
            - name: OIDC_USERINFO_ENDPOINT
              value: "https://id.smeyer.ca/api/oidc/userinfo"
            - name: OIDC_JWKS_ENDPOINT
              value: "https://id.smeyer.ca/api/oidc/jwks"
            - name: OIDC_END_SESSION_ENDPOINT
              value: "https://id.smeyer.ca/api/oidc/end-session"
            - name: CSRF_COOKIE_SECURE
              value: "TRUE"
            - name: DEBUG
              value: "FALSE"
            - name: HOST_NAME
              value: "pdf.smeyer.ca"
            - name: SESSION_COOKIE_SECURE
              value: "TRUE"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://pdf.smeyer.ca"
            # These two lines fix the Traefik 400/500 errors
            - name: USE_X_FORWARDED_HOST
              value: "True"
            - name: SECURE_PROXY_SSL_HEADER
              value: "HTTP_X_FORWARDED_PROTO,https"
            - name: ALLOWED_HOSTS
              value: "pdf.smeyer.ca,localhost,127.0.0.1"
          volumeMounts:
            - name: pdfding-db
              mountPath: /home/nonroot/pdfding/db
            - name: pdfding-media
              mountPath: /home/nonroot/pdfding/media
      volumes:
        - name: pdfding-db
          persistentVolumeClaim:
            claimName: pdfding-db-pvc # Match your Longhorn PVC name
        - name: pdfding-media
          persistentVolumeClaim:
            claimName: pdfding-data-pvc # Match your Longhorn PVC name

