apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdfding
  namespace: pdfding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdfding
  template:
    metadata:
      labels:
        app: pdfding
    spec:
      # This fixes the Longhorn permission issues
      initContainers:
        - name: init-pvc
          image: busybox
          command: ["sh", "-c", "mkdir -p /home/nonroot/pdfding/db /home/nonroot/pdfding/media && chown -R 1000:1000 /home/nonroot/pdfding/db /home/nonroot/pdfding/media"]
          volumeMounts:
            - name: pdfding-db
              mountPath: /home/nonroot/pdfding/db
            - name: pdfding-media
              mountPath: /home/nonroot/pdfding/media
      containers:
        - name: pdfding
          image: mrmn/pdfding:v1.6.3
          ports:
            - containerPort: 8000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pdfding-secrets
                  key: SECRET_KEY
            - name: CSRF_COOKIE_SECURE
              value: "TRUE"
            - name: DEBUG
              value: "FALSE"
            - name: HOST_NAME
              value: "pdf.smeyer.ca"
            - name: SESSION_COOKIE_SECURE
              value: "TRUE"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://pdf.smeyer.ca"
            # These two lines fix the Traefik 400/500 errors
            - name: USE_X_FORWARDED_HOST
              value: "True"
            - name: SECURE_PROXY_SSL_HEADER
              value: "HTTP_X_FORWARDED_PROTO,https"
            - name: ALLOWED_HOSTS
              value: "pdf.smeyer.ca,localhost,127.0.0.1"
          volumeMounts:
            - name: pdfding-db
              mountPath: /home/nonroot/pdfding/db
            - name: pdfding-media
              mountPath: /home/nonroot/pdfding/media
      volumes:
        - name: pdfding-db
          persistentVolumeClaim:
            claimName: pdfding-db-pvc # Match your Longhorn PVC name
        - name: pdfding-media
          persistentVolumeClaim:
            claimName: pdfding-data-pvc # Match your Longhorn PVC name
---
apiVersion: v1
kind: Service
metadata:
  name: pdfding
  namespace: pdfding
spec:
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: pdfding

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pdfding-data-pvc
  namespace: pdfding
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pdfding-db-pvc
  namespace: pdfding
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
