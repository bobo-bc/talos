# Middleware: redirect HTTP -> HTTPS
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pdfding-redirect-https
  namespace: pdfding
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# IngressRoute for HTTPS
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pdfding
  namespace: pdfding
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pdf.smeyer.ca`)
      kind: Rule
      services:
        - name: pdfding
          port: 80
  tls:
    secretName: wildcard-smeyer-ca-tls
---
# IngressRoute for HTTP (only used for redirect to HTTPS)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pdfding-http
  namespace: pdfding
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pdf.smeyer.ca`)
      kind: Rule
      middlewares:
        - name: pdfding-redirect-https
      services:
        - name: pdfding
          port: 80
