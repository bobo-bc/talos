apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: media
spec:
  serviceName: "mariadb"
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
      - name: mariadb
        image: lscr.io/linuxserver/mariadb:11.4.5
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Vancouver"
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-creds
              key: root-password
        - name: MYSQL_DATABASE
          value: "booklore"
        - name: MYSQL_USER
          value: "booklore"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-creds
              key: booklore_pass
        ports:
        - containerPort: 3306
          name: mysql
        livenessProbe:
          exec:
            command:
            - mariadb-admin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - mariadb-admin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: mysql-data
          mountPath: /config
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: longhorn
      resources:
        requests:
          storage: 5Gi
---
# --- Internal Service for Database ---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: media
spec:
  ports:
  - port: 3306
  selector:
    app: mariadb
---
# --- Booklore Application ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booklore
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booklore
  template:
    metadata:
      labels:
        app: booklore
    spec:
      containers:
      - name: booklore
    image: ghcr.io/adityachandelgit/booklore-app:latest
  env:
  - name: APP_USER_ID
    value: "1000"
  - name: APP_GROUP_ID
    value: "1000"
  - name: TZ
    value: "America/Vancouver"
  - name: BOOKLORE_PORT
    value: "6060"
  - name: DISK_TYPE
    value: "NETWORK"
  - name: DATABASE_URL
    value: "jdbc:mariadb://mariadb:3306/booklore?useSSL=false&allowPublicKeyRetrieval=true"
  - name: DATABASE_USERNAME
    value: "booklore"
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mariadb-creds
        key: booklore_pass
  - name: SWAGGER_ENABLED
    value: "false"
      volumes:
      - name: nfs-storage
        persistentVolumeClaim:
          claimName: nfs-media-pvc
---
# --- Networking (Service & Ingress) ---
apiVersion: v1
kind: Service
metadata:
  name: booklore
  namespace: media
spec:
  selector:
    app: booklore
  ports:
    - protocol: TCP
      port: 6060
      targetPort: 6060
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: booklore
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`books.smeyer.ca`)
    kind: Rule
    services:
    - name: booklore
      port: 6060
