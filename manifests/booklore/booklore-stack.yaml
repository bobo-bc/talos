# --- MariaDB Database (StatefulSet) ---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: media
spec:
  serviceName: "mariadb"
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
      - name: mariadb
        image: mariadb:11.2
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-creds
              key: root-password
        - name: MARIADB_ROOT_HOST
          value: "%"
        - name: MARIADB_DATABASE
          value: "booklore"
        - name: MARIADB_USER
          value: "booklore" # Matched to your Docker export
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-creds
              key: booklore_pass
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: longhorn
      resources:
        requests:
          storage: 5Gi
---
# --- Internal Service for Database ---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: media
spec:
  ports:
  - port: 3306
  selector:
    app: mariadb
---
# --- Booklore Application ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booklore
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booklore
  template:
    metadata:
      labels:
        app: booklore
    spec:
      containers:
      - name: booklore
        image: booklore/booklore:latest
        env:
        - name: BOOKLORE_PORT
          value: "6060"
        - name: DATABASE_USERNAME
          value: "booklore" # Matched to your Docker export
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mariadb-creds
              key: booklore_pass
        # Critical JDBC string pointing to internal K8s Service
        - name: DATABASE_URL
          value: "jdbc:mariadb://mariadb:3306/booklore?useSSL=false&allowPublicKeyRetrieval=true"
        - name: TZ
          value: "Etc/UTC"
        volumeMounts:
        - name: nfs-storage
          mountPath: /app/data
          subPath: images/booklore/data
        - name: nfs-storage
          mountPath: /bookdrop
          subPath: media/bookdrop
        - name: nfs-storage
          mountPath: /books
          subPath: media/books
      volumes:
      - name: nfs-storage
        persistentVolumeClaim:
          claimName: nfs-media-pvc
---
# --- Networking (Service & Ingress) ---
apiVersion: v1
kind: Service
metadata:
  name: booklore
  namespace: media
spec:
  selector:
    app: booklore
  ports:
    - protocol: TCP
      port: 6060
      targetPort: 6060
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: booklore
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`books.smeyer.ca`)
    kind: Rule
    services:
    - name: booklore
      port: 6060
