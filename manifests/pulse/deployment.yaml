apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pulse
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://rcourtman.github.io/Pulse
    chart: pulse
    targetRevision: "*"
    helm:
      values: |
        # Persistence
        persistence:
          enabled: true
          storageClass: longhorn
          size: 2Gi

        # Server configuration
        server:
          env:
            - name: DISCOVERY_SUBNET
              value: "10.0.0.0/24"
            - name: TZ
              value: "America/Vancouver"
          secretEnv:
            create: false          # we manage secret manually
            existingSecret: pulse-secret

        # Ingress via Traefik
        ingress:
          enabled: false           # we use IngressRoute instead

        # Extra manifests - IngressRoute
        extraDeploy:
          - apiVersion: traefik.io/v1alpha1
            kind: IngressRoute
            metadata:
              name: pulse
              namespace: pulse
            spec:
              entryPoints:
                - websecure
              routes:
              - match: Host(`pulse.smeyer.ca`)
                kind: Rule
                services:
                - name: pulse
                  port: 7655
              tls:
                certResolver: letsencrypt

        # Resource limits
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"

  destination:
    server: https://kubernetes.default.svc
    namespace: pulse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
#      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
  - group: ""
    kind: Secret
    name: pulse-secret
    jsonPointers:
      - /data
