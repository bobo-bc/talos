# Pulse Helm values
# Helm chart: https://rcourtman.github.io/Pulse
# These values are passed to the Pulse Helm chart via ArgoCD

replicaCount: 1

image:
  repository: rcourtman/pulse
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 7655

# Persistence using Longhorn
persistence:
  enabled: true
  storageClass: longhorn
  size: 1Gi
  accessMode: ReadWriteOnce

# Pull credentials from our secret
envFrom:
  - secretRef:
      name: pulse-secrets

# Resource limits appropriate for a monitoring app
resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 200m

# Security context - run as non-root
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false

# Disable built-in ingress - we use Traefik IngressRoute instead
ingress:
  enabled: false
