apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-config
  namespace: renovate
data:
  renovate.json: |
    {
      "$schema": "https://docs.renovatebot.com/renovate-schema.json",
      "platform": "github",
      "repositories": ["bobo-bc/talos"],

      "extends": [
        "config:recommended"
      ],

      "timezone": "America/Vancouver",

      "schedule": ["after 9am and before 5pm on Monday"],

      "labels": ["renovate", "dependencies"],

      "prConcurrentLimit": 10,
      "prHourlyLimit": 5,
      "rebaseWhen": "conflicted",

      "packageRules": [
        {
          "description": "Group all patch and minor updates together",
          "matchUpdateTypes": ["patch", "minor"],
          "groupName": "non-major updates",
          "automerge": false
        },
        {
          "description": "Major updates always get their own PR",
          "matchUpdateTypes": ["major"],
          "automerge": false,
          "labels": ["renovate", "major-update", "review-required"]
        },
        {
          "description": "Digest-only updates for container images (no tag change)",
          "matchUpdateTypes": ["digest"],
          "automerge": false,
          "groupName": "digest updates"
        }
      ],

      "kubernetes": {
        "fileMatch": [
          "manifests/.*\\.yaml$"

        ]
      },

      "helm-values": {
        "fileMatch": [
          ".*values\\.yaml$"
        ]
      },

      "argocd": {
        "fileMatch": [
          "argocd/.*\\.yaml$"
        ]
      },

      "kustomize": {
        "fileMatch": [
          "(^|/)kustomization\\.ya?ml$"
        ]
      }
    }
