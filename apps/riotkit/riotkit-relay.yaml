apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: riotkit-relay
  namespace: argocd
spec:
  project: default
  sources:
    # Source 1: The official Helm Chart
    - repoURL: 'https://riotkit-org.github.io/helm-of-revolution/'
      chart: smtp-ext-relay
      targetRevision: 1.2.x
      helm:
        values: |
          # Point the chart to the secret name generated by KSOPS
          extraEnvFrom:
            - secretRef:
                name: smtp-relay-credentials
          env:
            RELAY_HOST: "smtp.mailgun.org:587"
            RELAY_MAILGUN_SMTP_DOMAIN: "smtp.mailgun.org"
            RELAY_MAILGUN_SMTP_PORT: "587"
            RELAY_MAILGUN_EMAIL_DOMAIN: "smeyer.ca"

    # Source 2: Your local manifests (where KSOPS lives)
    - repoURL: 'https://github.com/your-user/your-repo.git' # Replace with your repo
      path: manifests/riotkit
      targetRevision: HEAD
  
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mail-system
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
