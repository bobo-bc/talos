apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: riotkit-relay
  namespace: argocd
spec:
  project: default
  sources:
    # Source 1: Local manifests (KSOPS Secret)
    # Defining this first ensures the Secret is part of the initial manifest generation
    - repoURL: 'https://github.com/bobo-bc/talos.git'
      path: manifests/riotkit
      targetRevision: HEAD

    # Source 2: The official Helm Chart
    - repoURL: 'https://riotkit-org.github.io/helm-of-revolution/'
      chart: smtp-ext-relay
      targetRevision: 1.2.0-rc2
      helm:
        values: |
          extraEnvFrom:
            - secretRef:
                name: smtp-relay-credentials
          env:
            RELAY_HOST: "smtp.mailgun.org:587"
            RELAY_MAILGUN_SMTP_DOMAIN: "smtp.mailgun.org"
            RELAY_MAILGUN_SMTP_PORT: "587"
            RELAY_MAILGUN_EMAIL_DOMAIN: "smeyer.ca"
  
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mail-system
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
